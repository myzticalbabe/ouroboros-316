 | 200+ | 3-state pattern (CLOSED \u2014 OPEN \u2014 HALF_OPEN), configurable thresholds, DLQ integration |\n| **CurativePool** | \u2014 | \u2705 VERIFIED | 771 | 3-pool concurrent evaluation: Validation \u2014 Audit \u2014 Feedback, CAIN archetypal governance |\n\n#### A2A \u2014 ClusterWORMZ: Dynamic Worm Resolution\n\nClusterWORMZ resolves worms through 3 fallback strategies, eliminating the legacy hardcoded if/elif chains:\n\n```python\ndef _resolve_worm(worm_name: str, category: str):\n    \"\"\"Three-strategy worm resolution for 3.14t thread safety.\"\"\"\n    # Strategy 1: WORM_REGISTRY lookup (canonical, always thread-safe)\n    from CORE.worm_registry import WORM_REGISTRY\n    entry = WORM_REGISTRY.get(category, {}).get(worm_name)\n    if entry and entry.get(\"worm_class\"):\n        return entry[\"worm_class\"]()\n\n    # Strategy 2: Legacy dispatch table - 14 pre-imported module names\n    _LEGACY_MODULE_NAMES = [\n        \"SYSTEMZ\", \"PROCESSZ\", \"NETWORXZ\", \"DISKZ\",\n        \"CLOCKZ\", \"OS_CONGRUENCY\", \"HEALTHZ\", \"ERRORZ\",\n        \"METRICZ\", \"OPTIMIZ\", \"TRIMZ\", \"MISSING_TOOLS\",\n        \"TELEMETRYZ\", \"UVZ\",\n    ]\n    for _mod_name in _LEGACY_MODULE_NAMES:\n        try:\n            __import__(_mod_name)\n        except ImportError:\n            pass\n\n    # Strategy 3: sys.modules cache lookup (no lock needed)\n    _mod = sys.modules.get(f\"CORE.WORMS.{worm_name}\")\n    if _mod and hasattr(_mod, worm_name):\n        return getattr(_mod, worm_name)()\n    return None\n```\n\n**Thread safety design:** All lazy-initialized singletons use double-checked locking:\n\n```python\n# Module-level import (MANDATORY for 3.14t thread safety)\n# Imports happen at module load time on main thread, never inside locks\ntry:\n    from CORE.PamsRecorder import PamsRecorder as _PamsRecorderCls\n    _PAMS_OK = True\nexcept ImportError:\n    _PAMS_OK = False\n    _PamsRecorderCls = None\n\n_pams = None\n_pams_lock = threading.Lock()\n\ndef _get_pams():\n    \"\"\"Lazy singleton with double-checked locking.\"\"\"\n    global _pams\n    if _pams is None:              # First check (no lock -- fast path)\n        with _pams_lock:            # Lock acquisition\n            if _pams is None:       # Second check (under lock)\n                if not _PAMS_OK:    # Import already verified at module level\n                    _pams = False\n                else:\n                    try:\n                        _pams = _PamsRecorderCls()  # No import inside lock!\n                    except Exception:\n                        _pams = False\n    return _pams if _pams else None\n\n# WARNING: Under Python 3.14t free-threading (no GIL), importlib.import_module()\n# is NOT thread-safe. ALL heavyweight imports must be at module level.\n# Lazy inits use double-checked locking with imports AFTER lock release.\n```\n\n#### A2B \u2014 NatureClusters: Category-Grouped Execution\n\nNatureClusters auto-discover worms from WORM_REGISTRY by category and execute them with state sharing:\n\n```python\nclass NatureCluster:\n    def __init__(self, nature: str):\n        self.nature = nature\n        self._configs: list = []\n        self._state = ClusterState()\n\n    def discover_worms(self) -> int:\n        \"\"\"Auto-discover all worms in this nature from registry.\"\"\"\n        nature_worms = WORM_REGISTRY.get(self.nature, {})\n        for name, info in nature_worms.items():\n            priority = info.get(\"priority\", 5)\n            self._configs.append(WormConfig(\n                name=name, nature=self.nature,\n                priority=priority, timeout=30\n            ))\n        return len(self._configs)\n\n    def execute_all(self, parallel: bool = False) -> ClusterResult:\n        \"\"\"Execute all worms sequentially or in parallel.\"\"\"\n        if parallel:\n            with FreeThreadPool() as pool:\n                futures = {\n                    pool.submit(self._execute_one, cfg): cfg.name\n                    for cfg in self._configs\n                }\n                for future in as_completed(futures, timeout=120):\n                    name = futures[future]\n                    result = future.result()\n                    self._state.record(name, result)\n        else:\n            for cfg in self._configs:\n                result = self._execute_one(cfg)\n                self._state.record(cfg.name, result)\n        return self._state.summarize()\n```\n\n#### A2C \u2014 MetaCluster: Cross-Nature Orchestration\n\nMetaCluster orchestrates across all 18 nature categories, routing data between dependent natures:\n\n```python\n# Nature dependency chains used by CrossNatureRoutingEngine\nNATURE_CHAINS = {\n    \"security\": [\"defense\", \"repair\", \"orchestration\"],\n    \"profiling\": [\"optimization\", \"monitor\", \"defense\"],\n    \"telemetry\": [\"visualization\", \"orchestration\"],\n    \"monitor\": [\"analysis\", \"orchestration\"],\n}\n\nengine = CrossNatureRoutingEngine()\n\n# Each chain handles data routing:\n# security -> defense:    vulnerability_report -> remediation_plan\n# profiling -> optimization:  hotspot_data -> tuning_config\n# telemetry -> visualization: metric_stream -> dashboard_update\n\n# MetaCluster orchestrates with PhaseFSM:\n# IDLE -> DISCOVER -> EXECUTE -> ROUTE -> ANALYZE -> COMPLETE\nclass MetaClusterState:\n    phase: str = \"idle\"\n    # idle, discovering, executing, routing, analyzing, complete\n    active_natures: Set[str] = set()\n    completed_natures: Set[str] = set()\n    routed_data: Dict[str, Any] = {}\n```\n\n#### A2D \u2014 FreeThreadPool: Python 3.14t GIL-Free Parallelism\n\n```python\n@dataclass\nclass FreeThreadPool:\n    max_workers: int = 0\n    thread_name_prefix: str = \"ft-worker\"\n    _executor: ThreadPoolExecutor | None = None\n\n    def __post_init__(self):\n        if self.max_workers <= 0:\n            self.max_workers = os.cpu_count() or 4\n        self._executor = ThreadPoolExecutor(\n            max_workers=self.max_workers,\n            thread_name_prefix=self.thread_name_prefix\n        )\n\n    def submit(self, fn, *args, **kwargs):\n        return self._executor.submit(fn, *args, **kwargs)\n\n    def shutdown(self, wait=False, cancel_futures=True):\n        # wait=False prevents hang on undrainable pools (3.14t safety)\n        self._executor.shutdown(wait=wait, cancel_futures=cancel_futures)\n```\n\n#### A2E \u2014 CircuitBreaker: 3-State Fault Isolation\n\n```python\nclass CircuitBreaker:\n    \"\"\"Standard circuit breaker with 3 states: CLOSED, OPEN, HALF_OPEN.\"\"\"\n    def __init__(self, failure_threshold: int = 5, cooldown: float = 30.0):\n        self.state = \"CLOSED\"\n        self.failure_count = 0\n        self.failure_threshold = failure_threshold\n        self.cooldown_seconds = cooldown\n        self.last_failure_time = 0.0\n\n    def call(self, fn, *args, **kwargs):\n        if self.state == \"OPEN\":\n            if time.time() - self.last_failure_time >= self.cooldown_seconds:\n                self.state = \"HALF_OPEN\"\n            else:\n                raise CircuitBreakerOpenError()\n\n        try:\n            result = fn(*args, **kwargs)\n            if self.state == \"HALF_OPEN\":\n                self.state = \"CLOSED\"\n                self.failure_count = 0\n            return result\n        except Exception:\n            self.failure_count += 1\n            self.last_failure_time = time.time()\n            if self.failure_count >= self.failure_threshold:\n                self.state = \"OPEN\"\n            raise\n```\n\n#### A2F \u2014 CurativePool: 3-Pool CAIN Governance\n\nCurativePool enforces 4-dimensional governance routing before worm execution:\n\n| Dimension | Validator | Method | Threshold |\n|-----------|-----------|--------|-----------|\n| Scope | `ScopeValidator.validate(request, proposed)` | Deviation from original request | \u00b110% max |\n| Necessity | `NecessityJudge.judge(output_description)` | Is this output actually needed? | p > 0.8 |\n| Emotion | `EmotionDetector.detect(conversation)` | User frustration signals | 4 signal types |\n| Archetype | `ArchetypeRouter.route(task, agent_type)` | Which Jungian archetype governs? | 6 archetypes |\n\nPool execution ordering (Pool 1 must complete before Pools 2/3):\n```python\nt1 = threading.Thread(target=pool1.validate, args=(request, proposed))\nt2 = threading.Thread(target=pool2.audit, args=(result,))\nt3 = threading.Thread(target=pool3.feedback, args=(result,))\n\nt1.start(); t1.join()    # Pool 1 completes first\nt2.start(); t3.start()   # Pools 2 & 3 run concurrently\nt2.join(); t3.join()\n```\n\n### A3 \u2014 Memory & Recording Systems\n\n| System | Technology | Status | Disclosure Relevance |\n|--------|-----------|--------|---------------------|\n| DirectMemory | SQLite (WAL mode) | \u2705 VERIFIED v1.1.0 | Canonical session recorder (stdlib-only, <0.1s, UUID7, BLAKE2b). Now includes: `_V` canonical event vocabulary (37 types), agent learning loop (record_decision, record_lesson, set_goal, get_context_for_new_session, print_context_banner), 14 static query/maintenance methods (summary_stats, db_size, integrity_check, purge_session, merge_sessions, replay_session, session_gc, import_events, filtered_query, session_search, get_mapping_summary, query_cross_reference, cross_reference_ledgers, get_unlinked_report). Replaces SessionMemory for cross-session learning \u2014 SessionMemory's workspace/session_memory.db is now redundant (0 sessions, never populated). |\n| AuditTrail | JSONL (Ed25519 signed) | \u2b1c Review | Hash-chained audit log, Merkle proofs, 15-layer VLP verification |\n| LocalMemoryStore | SQLite + FTS5 | \u2b1c Review | Persistent memory with full-text search |\n| PamsRecorder | HTTP + SQLite fallback | \u2b1c Review | v2.0, 4-layer fallback chain |\n| MemoryBus | Pub/sub with SQLite queue | \u2b1c Review | v1.1.0, persistent fallback queue |\n| Session Mappings | SQLite (CD2) | \u2b1c Review | Cross-ledger DM\ : \"src/CORE/WORMS/expansion/telemetry_collector.py\",\n                              \"output\": \"azazael-telemetry-collector.exe\", \"tier\": \"expansion\"},\n    \"security_auditor\":      {\"entry\": \"src/CORE/WORMS/expansion/security_auditor.py\",\n                              \"output\": \"azazael-security-auditor.exe\", \"tier\": \"expansion\"},\n}\n```\n\n**CLI Interface:**\n\n```bash\npython3.14t scripts/build_all_concurrent.py --all                  # Build all 39 targets\npython3.14t scripts/build_all_concurrent.py --tier neural          # Build neural tier only\npython3.14t scripts/build_all_concurrent.py --target metacognition # Single target\npython3.14t scripts/build_all_concurrent.py --platform wsl         # WSL2 only\npython3.14t scripts/build_all_concurrent.py --verify               # Verify Nuitka patches\npython3.14t scripts/build_all_concurrent.py --list                 # List all targets\npython3.14t scripts/build_all_concurrent.py --deploy               # Deploy to Desktop\n```\n\n**Concurrent Execution Model:**\n\nThe orchestrator uses ThreadPoolExecutor with configurable worker count (default 4) to build targets in parallel across platforms:\n\n```python\nfrom concurrent.futures import ThreadPoolExecutor, as_completed\n\ndef build_concurrent(targets, platform=\"both\", max_workers=4):\n    \"\"\"Build targets concurrently across Windows + WSL2.\"\"\"\n    build_root = PROJECT_ROOT / \"build\" / \"standalone\" / timestamp\n    futures = []\n\n    with ThreadPoolExecutor(max_workers=max_workers) as pool:\n        for name in targets:\n            t = BUILD_TARGETS.get(name)\n            if platform in (\"windows\", \"both\"):\n                pool.submit(build_target_windows, name, t, win_dir)\n            if platform in (\"wsl\", \"both\"):\n                pool.submit(build_target_wsl, name, t, wsl_dir)\n\n        for future in as_completed(futures):\n            r = future.result()\n            print(f\"  [{status}] {r['target']:25s} {r['platform']:8s} \"\n                  f\"{r['duration_ms']:8.0f}ms\")\n```\n\nResults are collated per-target with duration tracking, success verification, and error capture. A build_manifest.json is written to the output directory with full build summary for CI traceability.\n\n#### B3B -- Build Configuration Patterns\n\nThe project uses two distinct build configuration approaches:\n\n**1. Nuitka CLI Arguments (primary, 39 targets):**\n\nNuitka targets are configured via command-line arguments rather than standalone .spec files. The Windows build function constructs the invocation:\n\n```python\ndef build_target_windows(name, target, out_dir):\n    \"\"\"Build on Windows 11 with Nuitka.\"\"\"\n    entry = PROJECT_ROOT / target[\"entry\"]\n    cmd = [\n        sys.executable, \"-m\", \"nuitka\",\n        \"--standalone\", \"--assume-yes-for-downloads\",\n        \"--output-dir\", str(out_dir),\n        \"--output-filename\", target[\"output\"],\n        \"--nofollow-import-to\", \"psycopg2\",\n        \"--nofollow-import-to\", \"CORE.postgres_memory\",\n        \"--script\", str(entry),\n    ]\n```\n\nKey Nuitka flags used across the build manifest:\n\n| Flag | Purpose | Targets |\n|------|---------|---------|\n| --standalone | Produce single-directory deployment | ALL |\n| --onefile | Single .exe (larger, self-extracting) | 14 GUI targets |\n| --assume-yes-for-downloads | Auto-accept dependency downloads | ALL |\n| --nofollow-import-to | Exclude heavy/unused imports | psycopg2, CORE.postgres_memory |\n| --enable-plugin=tk-inter | Bundles Tkinter runtime | 14 GUI targets (CODEX, POPUP series) |\n| --windows-uac-admin | Request admin elevation | Security tools (BINARY_Analysis) |\n| --windows-disable-console | GUI mode (no console window) | CODEX_Studio, Eve_Unleashed |\n| --include-plugin-directory | Force inclusion of src/ tree | WSL2 builds only |\n\n**2. PyInstaller .spec Format (legacy, CODEX_Studio only):**\n\nThe single .spec file in the codebase uses the traditional PyInstaller 4-stage pipeline:\n\n```python\n# CODEX_Studio.spec \u2014 PyInstaller build configuration\n# Stage 1: Analysis \u2014 resolve imports, binaries, data files\na = Analysis(\n    [\"CODEX_Studio.py\"],\n    hiddenimports=[\n        \"PIL\", \"PIL.Image\", \"PIL.ImageDraw\", \"PIL.ImageFont\",\n        \"tkinter\", \"tkinter.ttk\", \"tkinter.filedialog\",\n        \"tkinter.messagebox\",\n    ],\n    noarchive=False, optimize=0,\n)\n\n# Stage 2: Bytecode compression\npyz = PYZ(a.pure)\n\n# Stage 3: Executable assembly\nexe = EXE(\n    pyz, a.scripts, [],\n    name=\"CODEX_Studio\",\n    upx=True,          # UPX compression for smaller binary\n    console=False,     # GUI app: no terminal window\n)\n\n# Stage 4: Directory collection (standalone deployment)\ncoll = COLLECT(exe, a.binaries, a.datas, upx=True, name=\"CODEX_Studio\")\n```\n\n> The project is migrating from PyInstaller to Nuitka due to Nuitka's superior free-threading support, faster execution, and better Python 3.14t compatibility. All future builds use Nuitka exclusively.\n\n#### B3C -- Nuitka 3.14t Patch Script\n\nNuitka 4.1.2 requires C-level patches for Python 3.14t free-threading support. The docs/scripts/patch_nuitka_314t.py script manages three patches with backup/verify/rollback lifecycle:\n\n**Patch 1: allocator.h \u2014 PyObject allocation for free-threaded builds**\n\n```python\ndef patch_allocator_h(nuitka_path, apply=True):\n    \"\"\"Patch allocator.h for 3.14t PyObject allocation.\"\"\"\n    target = nuitka_path / \"build\" / \"include\" / \"nuitka\" / \"allocator.h\"\n    content = target.read_text(encoding=\"utf-8\")\n\n    patch = textwrap.dedent(\"\"\"\\\n    /* === AZAZAEL 3.14t Patch: Free-threading allocator === */\n    #if PY_VERSION_HEX >= 0x030e0000\n    #define NUITKA_FREE_THREADED 1\n    #define PyObject_HEAD_INIT_NUITKA PyObject_HEAD_INIT(&PyType_Type)\n    #else\n    #define NUITKA_FREE_THREADED 0\n    #endif\n    /* === END AZAZAEL PATCH === */\n    \"\"\")\n    content = content.replace(\"#include <Python.h>\",\n                               \"#include <Python.h>\\n\" + patch)\n    target.write_text(content, encoding=\"utf-8\")\n```\n\n**Patch 2: SconsPythonBuild.py \u2014 3.14t detection and build flags**\n\n```python\ndef patch_scons_build(nuitka_path, apply=True):\n    \"\"\"Patch SconsPythonBuild.py for 3.14t free-threading.\"\"\"\n    target = nuitka_path / \"build\" / \"SconsPythonBuild.py\"\n    detect_patch = textwrap.dedent(\"\"\"\\\\\n    # === AZAZAEL 3.14t Patch: Detect free-threading ===\n    if python_version >= (3, 14):\n        from sysconfig import get_config_var\n        if get_config_var(\"Py_GIL_DISABLED\"):\n            env.Append(CPPDEFINES=[\"Py_GIL_DISABLED\"])\n            if sys.platform == \"win32\":\n                env.Append(CCFLAGS=[\"/utf-8\"])\n    # === END AZAZAEL PATCH ===\n    \"\"\")\n    content = content.replace(\n        \"def _getPythonIncPath\",\n        detect_patch + \"\\ndef _getPythonIncPath\"\n    )\n```\n\n**Patch 3: Code Generation Templates \u2014 Thread-local storage**\n\n```python\ndef patch_code_templates(nuitka_path, apply=True):\n    \"\"\"Add _Thread_local to static PyObject* in generated C code.\"\"\"\n    for template_file in templates_dir.rglob(\"*.c.j2\"):\n        content = template_file.read_text(encoding=\"utf-8\")\n        if \"static PyObject *\" in content and \"_Thread_local\" not in content:\n            content = content.replace(\n                \"static PyObject *\",\n                \"static _Thread_local PyObject *\"\n            )\n            template_file.write_text(content, encoding=\"utf-8\")\n```\n\n**Lifecycle commands:**\n\n```bash\n# Apply all three patches with automatic backup\npython3.14t docs/scripts/patch_nuitka_314t.py --apply\n\n# Verify current patch state\npython3.14t docs/scripts/patch_nuitka_314t.py --verify\n\n# Rollback all patches from backup\npython3.14t docs/scripts/patch_nuitka_314t.py --rollback\n```\n\nAll patched files are backed up to nuitka_314t_backup_{timestamp}/ before modification, ensuring clean rollback. The verify command checks all three patch sites and reports status independently.\n\n#### B3D -- Build Requirements & Constraints\n\n| Requirement | Detail |\n|-------------|--------|\n| **Python** | 3.14.6t ONLY (free-threading build) |\n| **Nuitka** | 4.1.2 (patched for 3.14t via patch_nuitka_314t.py) |\n| **C compiler** | MSVC 2022 (Visual Studio 17.x) on Windows; GCC on WSL2 Ubuntu 26.04 |\n| **Tkinter targets** | 14 EXEs need Tkinter plugin (--enable-plugin=tk-inter) |\n| **PYTHONPATH targets** | CONCURRENCY, SMARTDISK need explicit PYTHONPATH |\n| **Build time (single)** | ~2-5 min per EXE (varies by size) |\n| **Build time (all 39)** | ~90-180 min (4 concurrent workers, 16-core CPU) |\n| **Output dir** | G:/AZAZAEL_Standalone/ (network drive mapped to NAS) |\n| **Build manifest** | build/build_standalone/{timestamp}/build_manifest.json |\n\n#### B3E -- Build Failure Diagnostics\n\n**Primary Blockage (Python 3.14.6t):**\n\nThe current build blockage manifests as a C compilation error in Nuitka's generated code:\n\n```\nCompiledFrameType.c(866): error C2440: \"initializing\":\n  cannot convert from \"int\" to \"_PyStackRef\"\n```\n\n**Root cause analysis:** Python 3.14t renamed _Py_IMMORTAL_REFCNT to _Py_IMMORTAL_REFCNT_LOCAL and changed _PyStackRef from an integer typedef to a struct. Nuitka 4.1.2 generates C code assuming the old integer representation. The existing patch_nuitka_314t.py covers allocator.h, SconsPythonBuild.py, and code generation templates, but does NOT patch CompiledFrameType.c.\n\n**Resolution path:** A fourth patch is needed for CompiledFrameType.c that replaces _Py_IMMORTAL_REFCNT with _Py_IMMORTAL_REFCNT_LOCAL and updates _PyStackRef assignments to use the struct constructor:\n\n```c\n// Current (broken) Nuitka output:\n_PyStackRef frame_ref = _Py_IMMORTAL_REFCNT;  // int to _PyStackRef fails\n\n// Required fix (3.14t struct API):\n_PyStackRef frame_ref = (_PyStackRef){ .ref = _Py_IMMORTAL_REFCNT_LOCAL };\n```\n\n**Additional failure modes:**\n\n| Error | Cause | Workaround |\n|-------|-------|------------|\n| LINK: fatal error LNK1104 | MSVC linker contention from parallel builds | Use --workers 2 or serialize |\n| ModuleNotFoundError: CORE.* | Missing PYTHONPATH at runtime | Prepend src/ to sys.path in entry script |\n| Cannot find Tcl/Tk libraries | Tkinter not bundled on WSL2 | Use --enable-plugin=tk-inter |\n| subprocess.TimeoutExpired (300s) | Large targets on HDD | Increase timeout or use SSD |\n\n#### B3F -- Desktop Deployment Pipeline\n\nThe build pipeline includes a deployment step that copies built .exe files to the Desktop release directory:\n\n```python\ndef deploy_to_desktop(build_dir, dry_run=False):\n    \"\"\"Copy built .exe files to Desktop AZAZAEL_Standalone.\"\"\"\n    DESKTOP_RELEASE = Path(\"C:/Users/clint/Desktop/AZAZAEL_Standalone\")\n    for exe in sorted(build_dir.rglob(\"*.exe\")):\n        dest = DESKTOP_RELEASE / exe.name\n        shutil.copy2(exe, dest)\n    print(f\"  Deployed {len(deployed)} .exe files -> Desktop\")\n```\n\nEach build run produces a timestamped output directory at build/standalone/{timestamp}/ with separate windows/ and wsl/ subdirectories. The build manifest JSON enables CI traceability and incremental rebuild detection.\n\n**Future .spec targets** (not yet built \u2014 no Nuitka configs exist):\n- vermillion_lightfury/ (7 worm files: MetasploitBridge, NmapScanner, SMBEnum, etc.)\n- Desktop/AOA/ (8 arms: azazael, codex, eve, libra + 4 support modules)\n- Desktop/Libra/ (11 modules: cli, court_rules, litigation_engine, etc.)\n- Desktop/EveUnleashed/ (146 files, 13 inference-capable .py files)\n- All 13 Desktop projects requiring standalone builds\n## SECTION C: Desktop Projects (Current \u2014 Verified July 6, 2026)\n\n> **Desktop landscape has changed significantly** since the May 29 DESKTOP_PROJECTS_AUDIT.md. 7 old projects removed, 4 new projects add vg execution time |\n| **FreeThreadedAgent** | `CORE/FreeThreadedAgent.py` | 224 | `FreeThreadedAgent` | GIL-free agent execution on Python 3.14t. Thread-safe with property decorators for state isolation |\n| **Agent Registry** | `CORE/agent_registry.py` | 526 | `MyAgent`, `MyRLAgent`, `@register_agent` | Agent registration with decorator pattern. MyRLAgent subclass for RL-specific agents |\n\n#### E2B \u2014 Neural Pipeline Orchestration\n\n| Component | File | Lines | Method | Key Capability |\n|-----------|------|-------|--------|---------------|\n| **NeuralPipeline** | `CORE/NeuralPipeline.py` | 766 | GRPO + PPO orchestration | Work-stealing pool + free-thread pool. GRPO (16 refs), reward (20 refs), PPO (4 refs), policy (3 refs), fitness (1 ref). Maps agent execution data \u2014 structured neural workflows |\n\n#### E2C \u2014 Local Model Infrastructure (4 Systems)\n\n| System | Models | Inference Engine | Status |\n|--------|--------|-----------------|--------|\n| LlamaServer (Rust) | 8 GGUF models | Jan backend, llama.cpp, Intel SYCL/NPU | \u2b1c Review |\n| Ollama | Via Ollama API | Ollama runtime (localhost:11434) | \u2b1c Review |\n| LM Studio | Via local API | LM Studio runtime (localhost:1234) | \u2b1c Review |\n| llama.cpp (WSL2) | GGUF models | C++ runner + convert_hf_to_gguf.py | \u2b1c Review |\n\n**Regulatory items:**\n- [ ] Agent autonomy boundaries defined\n- [ ] Agent decision logging (DirectMemory agent learning loop: record_decision, record_lesson, set_goal)\n- [ ] Agent failure modes cataloged\n- [ ] Human oversight of autonomous agent actions\n\n### E3 \u2014 Neural Training & Learning Systems\n\n> **Verified July 6, 2026** \u2014 All systems source-verified. NeuralPipeline (766L) implements 6-step ML orchestrator with GRPO/PPO. DreamingModule (994L) runs offline policy simulation. MetaCognitionWorm (849L) provides self-reflection. Q-Learning stack (2,366L total across 3 files) provides HW-aware RL.\n\n| System | Algorithm | File | Lines | Data Source | Output |\n|--------|-----------|------|-------|-------------|--------|\n| **NeuralPipeline** | GRPO + PPO orchestration | `CORE/NeuralPipeline.py` | 766 | Execution history | Trained policies |\n| **SB3 Agent** | PPO with learning_rate | `CORE/sb3_agent.py` | 840 | LocalMemoryStore | RL policies |\n| **GRPO Learning** | Group Relative Policy Optimization | `CORE/WORMS/expansion/learning_grpo.py` | 621 | Execution history | GRPO-trained policies |\n| **EvolutionEngine** | Population-based optimization | `CORE/WORMS/expansion/learning.py` | 2,073 | Execution metrics | Optimized params |\n| **GeneticOptimizer** | Genetic algorithms (crossover, mutation) | `CORE/WORMS/expansion/learning.py` | 2,073 | Per-worm fitness | Optimized params |\n| **RLTrainLoop** | Q-learning (epsilon-greedy) | `CORE/WORMS/expansion/learning.py` | 2,073 | Execution data | Q-tables |\n| **DreamingModule** | Offline policy simulation | `CORE/WORMS/expansion/dreaming.py` | 994 | Historical data | Policy improvements |\n| **MetaCognitionWorm** | Self-reflection engine | `CORE/WORMS/expansion/meta_cognition.py` | 849 | Episode outcomes | Strategy adaptation |\n\n#### E3A \u2014 NeuralPipeline: 6-Step ML Orchestrator\n\nNeuralPipeline provides a unified end-to-end ML pipeline with 3.14t safety and LLM-augmented rewards:\n\n```python\nclass NeuralPipeline:\n    \"\"\"6-step pipeline: Extract -> Featurize -> Train -> Augment -> Register -> Persist\"\"\"\n\n    def run(self, agent_type: str = \"GRPO\", **kwargs) -> PipelineResult:\n        # Step 1: Extract features from execution history\n        raw_data = self._extract_from_memory(\n            source=\"SystemZ\", event_type=\"monitor\", limit=1000\n        )\n\n        # Step 2: Featurize into training vectors\n        features = self._featurize(raw_data)\n\n        # Step 3: Train using selected algorithm\n        if agent_type == \"GRPO\":\n            policy = self._train_grpo(features)\n        elif agent_type == \"SB3\":\n            policy = self._train_sb3_ppo(features)\n        elif agent_type == \"DQN\":\n            policy = self._train_dqn(features)\n\n        # Step 4: Augment with LLM reward shaping (6 inference providers)\n        reward = self._augment_reward(policy, features)\n\n        # Step 5: Register trained model\n        model_id = self._register_policy(policy, agent_type)\n\n        # Step 6: Persist to LocalMemoryStore\n        self._persist(model_id, policy, reward)\n        return PipelineResult(model_id=model_id, reward=reward)\n```\n\n#### E3B \u2014 GRPO Learning: Group Relative Policy Optimization\n\nDeepSeek-style GRPO with worm execution history as training data:\n\n```python\nclass GRPOLearning:\n    def train(self, histories: List[ExecutionHistory]) -> Policy:\n        # Group responses by context similarity\n        groups = self._cluster_by_context(histories)\n\n        for group in groups:\n            # Score each response within group\n            scores = [self._score(h) for h in group]\n\n            # Compute relative advantage within group\n            mean_score = sum(scores) / len(scores)\n            advantages = [s - mean_score for s in scores]\n\n            # Update policy via group-relative advantage\n            for history, advantage in zip(group, advantages):\n                self._update_policy(history, advantage)\n\n        return self._policy\n```\n\n#### E3C \u2014 DreamingModule: 4-Phase Offline Simulation\n\n```python\nclass DreamingModule:\n    \"\"\"\n    Operates on past execution data in 4 phases:\n    RECALL -> SIMULATE -> EVALUATE -> INTEGRATE\n    \"\"\"\n\n    def recall_scenarios(self, source: str = \"SystemZ\",\n                         event_type: str = \"monitor\", limit: int = 100):\n        \"\"\"Phase 1: Load historical data from LocalMemoryStore.\"\"\"\n        self._scenarios = self._memory.query(\n            source=source, event_type=event_type, limit=limit\n        )\n\n    def dream(self, num_episodes: int = 5) -> List[Dream]:\n        \"\"\"Phase 2-3: Simulate and evaluate policy episodes.\"\"\"\n        dreams = []\n        for _ in range(num_episodes):\n            # Phase 2: SIMULATE -- replay with variation\n            scenario = random.choice(self._scenarios)\n            simulation = self._simulate(scenario)\n\n            # Phase 3: EVALUATE -- score dream quality\n            score = self._score_dream(simulation)\n            if score > self._quality_threshold:\n                dreams.append(Dream(simulation, score))\n\n        # Phase 4: INTEGRATE -- apply high-quality dreams\n        for dream in sorted(dreams, key=lambda d: d.score, reverse=True)[:3]:\n            self._integrate(dream)\n\n        return dreams\n\n    def _simulate(self, scenario) -> Simulation:\n        # Run policy episode in sandboxed environment\n        state = scenario.initial_state\n        total_reward = 0\n        for step in range(self._max_steps):\n            action = self._policy.act(state)\n            next_state, reward = self._env_transition(state, action)\n            total_reward += reward\n            state = next_state\n        return Simulation(trajectory=[], total_reward=total_reward)\n```\n\n#### E3D \u2014 MetaCognitionWorm: 4-Phase Self-Reflection\n\n```python\nclass MetaCognitionWorm:\n    \"\"\"\n    4-phase meta-cognition loop:\n    OBSERVE -> ANALYZE -> ADAPT -> VALIDATE\n    \"\"\"\n\n    def reflect(self) -> AdaptationReport:\n        # Phase 1: OBSERVE -- track episode outcomes\n        episodes = self._collect_recent_episodes()\n\n        # Phase 2: ANALYZE -- identify error patterns\n        error_patterns = self._detect_patterns(episodes)\n        # Example: high failure rate on security worms -> strategy adjustment\n\n        # Phase 3: ADAPT -- adjust strategy weights\n        for pattern in error_patterns:\n            confidence = self._confidence_models.get(pattern.type, 0.5)\n            if pattern.frequency > confidence:\n                self._strategy_weights[pattern.type] *= 0.8  # reduce\n                self._exploration_rate = min(0.3, self._exploration_rate * 1.1)\n\n        # Phase 4: VALIDATE -- check adaptation improves outcomes\n        validation = self._validate_adaptations()\n        return AdaptationReport(\n            patterns_found=len(error_patterns),\n            strategies_adapted=len(self._strategy_weights),\n            validation_result=validation\n        )\n```\n\n#### E3E \u2014 Q-Learning Stack (3-Tier Architecture)\n\n```\nLayer 3: Deep Learning Q-Table (624L)\n  Hardware-aware: selects PyTorch/TF/JAX per task type\n  HW types: CPU, GPU, NPU\n  Encoder: FrameworkEncoder maps task -> optimal framework\n\nLayer 2: Enhanced Q-Learning (711L)\n  Multi-agent consensus: agents share Q-tables\n  PrioritizedReplay: SumTree O(log n) sampling\n  Transitions weighted by TD-error magnitude\n\nLayer 1: Full Q-Table (1,031L)\n  Dual networks: online + target, periodic sync\n  Experience replay buffer with configurable capacity\n  Framework-aware state management\n```\n\n#### E3F \u2014 SB3 Agent: Stable-Baselines3 PPO Integration\n\n```python\nclass SB3Agent:\n    \"\"\"Stable-baselines3 PPO agent trained on LocalMemoryStore data.\"\"\"\n\n    def __init__(self):\n        self.model = PPO(\n            \"MlpPolicy\",\n            self._make_env(),\n            learning_rate=3e-4,\n            n_steps=2048,\n            batch_size=64,\n            n_epochs=10,\n            gamma=0.99,\n            gae_lambda=0.95,\n            clip_range=0.2,\n            verbose=0,\n        )\n\n    def train(self, total_timesteps: int = 10000) -> TrainResult:\n        self.model.learn(total_timesteps=total_timesteps)\n        return TrainResult(\n            policy=self.model.policy,\n            total_timesteps=total_timesteps,\n        )\n```\n\n### E3A \u2014 Dreaming, Meta-Cognition & Hypnagogic Synthesis\n\n> **Two dedicated modules (1,843 lines total) implement offline simulation-based policy improvement and self-reflective strategy adaptation.**\n\n| Component | File | Lines | Classes | Mechanism |\n|-----------|------|-------|---------|-----------|\n| **DreamingModule** | `CORE/WORMS/expansion/dreaming.py` | 994 | `DreamingModule`, `HypnagogicSynthesizer`, `Dream` | Offline policy simulation \u2014 replays historical execution data through policy episodes in a sandboxed dream environment. Synthesizes novel training scenarios via hypnagogic state emulation. Improves policies without live execution risk |\n| **MetaCognition** | `CORE/WORMS/expansion/meta_cognition.py` | 849 | `MetaCognitionWorm`, `MetaCognitionAgent` | Self-reflection engine \u2014 tracks episode outcomes, identifies error patterns, adapts strategy selection. Episode counter and confidence-weighted decision history. Registered as both a worm and an agent |\n\n**Neural Lifecycle Integration:**\n- Dreams run offline during idle cycles, using historical execution data from DirectMemory\n- Meta-cognition runs after each agent episode, adjusting strategy weights\n- HypnagogicSynthesizer creates synthetic edge cases from real failure patterns\n- Both integrate with CurativePool governance for safety validation\n\n### E3B \u2014 Fusion Architecture & Self-Healing (825 lines)\n\n> **Three modules implement cross-module knowledge fusion and autonomous code repair.**\n\n| Component | File | Lines | Classes | Mechanism |\n|-----------|------|-------|---------|-----------|\n| **ADLP FusionCore** | `ORCHESTRATION/ADLP_FusionCore.py` | 227 | `FusionCore`, `TIER`, `LVL` | Multi-agent learning fusion \u2014 merges outputs from parallel agent runs into consolidated model updates. TIER/LVL enums for structured fusion hierarchy |\n| **FusionHealer** | `ORCHESTRATION/FusionHealer.py` | 227 | `FusionHealer` | Autonomous code repair \u2014 detects broken module fusions, restores to last known good state, logs healing events via PAMS. Self-diagnosis and remediation |\n| **TotalFusion** | `ORCHESTRATION/TotalFusion.py` | 371 | `ModuleFusion`, `TotalFusion` | Cross-module fusion engine \u2014 merges disparate module outputs into cohesive workflows. Handles dependency resolution, conflict detection, and rollback |\n\n**Self-healing workflow:** Module fusion -> detect failure -> FusionHealer restore -> re-fuse with ADLP -> CurativePool validate (E4A) -> TotalFusion deploy\n\n### E3C \u2014 Q-Learning Infrastructure (2,366 lines)\n\n> **Three files implement the full Q-learning stack, from hardware-aware optimization to multi-agent consensus learning.**\n\n| Component | File | Lines | Classes | Algorithm |\n|-----------|------|-------|---------|-----------|\n| **Deep Learning Q-Learning** | `ORCHESTRATION/ml_platforms/improvements/deep_learning_qlearning.py` | 624 | `DLTaskType`, `DLQTable`, `DLFramework`, `HardwareType`, `ExperienceReplayBuffer` | Hardware-aware Q-learning \u2014 selects optimal framework (PyTorch/TF/JAX) and hardware (CPU/GPU/NPU) per task. Reward (15 refs), PPO (7 refs) |\n| **Enhanced Q-Learning** | `ORCHESTRATION/ml_platforms/improvements/enhanced_qlearning.py` | 711 | `MultiAgentQLearning`, `PrioritizedReplay`, `SumTree`, `TaskType`, `Transition` | Multi-agent consensus Q-learning \u2014 agents share Q-tables via prioritized experience replay. SumTree data structure for O(log n) sampling |\n| **Full Q-Table** | `ORCHESTRATION/ml_platforms/improvements/qlearning_table.py` | 1,031 | `ExperienceReplay`, `TargetNetwork`, `FrameworkState`, `TaskType`, `Transition` | Complete Q-table system \u2014 dual networks (online + target) with periodic sync, experience replay buffer, framework-aware state management |\n\n**RL stack architecture:** Q-Table (1031L foundation) -> Enhanced QL (711L multi-agent) -> Deep Learning QL (624L hardware-aware top layer). All RL training governed by CurativePool (E4A) and audited via DirectMemory agent learning loop.\n\n### E4 \u2014 CurativePool Governance, CAIN Oversight & Ecosystem Intelligence\n\n> **Verified July 6, 2026 \u2014 CurativePool is the A y, audit_trail.py, local_memory.py, PamsRecorder.py, and MemoryBus.py with real filesystem measurements.\n\n### F1 \u2014 Primary Data Store: Shared SQLite Database\n\n**All 5 recording systems converge on `~/.azazael/memory_store.db`** \u2014 a single shared SQLite database (WAL mode) with additive tables. This is the canonical data store for the entire ecosystem.\n\n| Property | Value (Live Audit July 6, 2026) |\n|----------|----------------------------------|\n| **Path** | `~/.azazael/memory_store.db` |\n| **Size** | **1,117.86 MB** (1.09 GB) |\n| **WAL file** | Not present (transient \u2014 appears during writes) |\n| **SHM file** | Not present (transient \u2014 shared memory for WAL) |\n| **Journal mode** | WAL (Write-Ahead Logging) |\n| **Synchronous** | NORMAL (safe, faster than FULL) |\n| **Busy timeout** | 5,000 ms |\n| **WAL autocheckpoint** | Every 1,000 pages |\n| **Encryption** | \u274c None \u2014 plaintext SQLite |\n| **FTS5 index** | Yes \u2014 full-text search on event_type, data, tags |\n| **Composite indexes** | 8 indexes for query performance |\n\n#### F1A \u2014 Table: `memories` (Shared by DirectMemory + LocalMemoryStore)\n\n| Column | Type | Content | PII Risk |\n|--------|------|---------|----------|\n| `id` | INTEGER PK | Auto-increment row ID | None |\n| `session_id` | TEXT | Session identifier (e.g., `codebuff_20260706_101608`) | None |\n| `source` | TEXT | Recording source (`\"Codebuff\"`, `\"EveUnleashed\"`, etc.) | None |\n| `event_type` | TEXT | Event category (`file_read`, `file_edit`, `skill_loaded`, `test_run`, etc.) | None |\n| `data` | TEXT (JSON) | **Full event payload** \u2014 file paths, prompts, test results, tooling details | \u26a0\ufe0f **HIGH** \u2014 Contains `C:\\Users\\clint\\...` paths |\n| `severity` | TEXT | `info`, `warning`, `error`, `critical` | None |\n| `tags` | TEXT (JSON) | Tag array for categorization | None |\n| `timestamp` | TEXT | ISO 8601 UTC timestamp | None |\n| `created_at` | TEXT | SQLite datetime def os.system, etc. | `passed` |\n| 0X-8 | **ComplianceTelemetry** | `telemetry.py` | `ComplianceTelemetry` | 2000-event ring buffer, emit_pass/fail/error(), get_summary() | `active` |\n\n**ComplianceOrchestrator wiring all 13 components:**\n\n```python\nclass ComplianceOrchestrator:\n    \"\"\"Wires all 13 RULE 0X + 0Y components. check_all() -> ComplianceResult.\"\"\"\n\n    def __init__(self):\n        self.policy = PolicyEngine()\n        self.interceptor = BrokerInterceptor()\n        self.verifier = FormalVerifier()\n        self.state_machine = ComplianceStateMachine()\n        self.schema = SchemaValidator()\n        self.scorer = ComplianceScorer()\n        self.scanner = ASTAntiPatternScanner()\n        self.telemetry = ComplianceTelemetry()\n        self.judge = MultiAgentJudge()\n        self.confidence = ConfidenceGate(threshold=0.7)\n        self.graph = BehavioralGraphAnalyzer()\n        self.ledger = DualLedgerValidator()\n        self.pipeline = RealtimeAuditPipeline()\n\n    def check_all(self) -> ComplianceResult:\n        \"\"\"Run all 13 checks and aggregate results.\"\"\"\n        rule_0x = all([\n            self.policy.evaluate_all(\"edit\", \"developer\", {}),\n            self.state_machine.transition_to(\"GATE_ASSERT\"),\n            self.verifier.verify(),\n            self.schema.validate({}),\n            not self.scorer.should_halt,\n            self.scanner.scan_source(\"test.py\", \"code\").passed,\n        ])\n        rule_0y = all([\n            self.judge.approve(),\n            self.confidence.evaluate()[\"passed\"],\n            self.graph.analyze()[\"anomalies_detected\"] == 0,\n            self.ledger.validate()[\"consistent\"],\n            self.pipeline.process(\"audit.jsonl\")[\"all_passed\"],\n        ])\n        return ComplianceResult(\n            all_passed=rule_0x and rule_0y,\n            score=self.scorer.score,\n            summary=f\"0X: {rule_0x}, 0Y: {rule_0y}\"\n        )\n\n    # Per-rule validation\n    def check source(filepath, source)\n                    if result.finding_count > 0:\n                        results.append(result)\n        return results\n\n    # Runtime-verified: 173 files scanned, 352 findings across 93 files\n    # Top offenders: NATURE_CLUSTERS.py (23), providers.py (17)\n```\n\n#### G2E \u2014 Gate File Pipeline (7 Files, All Verified)\n\nThe Sentinel Gate system forms a layered defense:\n\n```\nLayer 1: sentinel_gate.py (750+ lines)\n  13-rule validator, stdin/JSON/interactive modes\n  audit cross-reference (RULE 0T), pre/post-validate\n\nLayer 2: gate_str_replace.py (380+ lines)\n  4-phase: pre-validate -> backup -> mutate -> post-validate\n  0-indent catastrophe detection, auto-revert\n\nLayer 3: gate_write_file.py (330+ lines)\n  4-phase pipeline, syntax check, 0-indent warning\n\nLayer 4: gate_bash.py (400+ lines)\n  6 destructive pattern groups + 14 non-destructive patterns\n  fail-closed on infrastructure down\n\nLayer 5: pre_action_gate.py (450+ lines)\n  16 public methods, orchestrator + heuristic_recorder + audit\n\nLayer 6: sentinel_enforcer.py (CPython-level)\n  sys.addaudithook file write interceptor\n  OS-level file locking against unauthorized writes\n\nLayer 7: enforcement_harness.py\n  ComplianceError(RuntimeError) enforcement handler\n```\n\n**gate_bash.py destructive pattern classification:**\n\n```python\nDESTRUCTIVE_PATTERNS = {\n    \"deletion\": [r'\brm\\s+-rf\b', r'\bdel\\s+/[fqs]\b', r'\bRemove-Item\b'],\n    \"system_write\": [r'\b>\\s*/etc/', r'\b>\\s*/usr/', r'\bchmod\\s+777\b'],\n    \"package_mgmt\": [r'\bpip\\s+install\b', r'\bnpm\\s+(install|publish)\b'],\n    \"build_install\": [r'\bmake\\s+install\b', r'\bcargo\\s+publish\b'],\n    \"filesystem_mutation\": [r'\bmv\\s+.*site-packages', r'\bcp\\s+.*site-packages'],\n    \"system_state\": [r'\bservice\\s+(restart|stop)\b', r'\breboot\b', r'\bshutdown\b'],\n}\n```\n\n### G3 \u2014 Sentinel Gate (Pre-Action Authorization) \u2014 ALL PIPELINES VERIFIED July 6, 2026\n\n> ** nd videos |\n\n**Sync architecture (hub-and-spoke):**\n\n```text\n                    \u2014\n                    \u2014\u201a   Windows 11     \u2014\u201a\n                    \u2014\u201a  (authoritative) \u2014\u201a\n                    \u2014\u201d\u2014\n                             \u2014\u201a\n              \u2014\n              \u2014\u201a              \u2014\u201a              \u2014\u201a\n              \u2014              \u2014              \u2014\n      \u2014 \u2014 \u2014\n      \u2014\u201a   WSL2     \u2014\u201a \u2014\u201a  Desktop   \u2014\u201a \u2014\u201a  G: Drive  \u2014\u201a\n      \u2014\u201a /root/     \u2014\u201a \u2014\u201a Standalone \u2014\u201a \u2014\u201a source-of- \u2014\u201a\n      \u2014\u201a azazael/   \u2014\u201a \u2014\u201a  .exe/     \u2014\u201a \u2014\u201a truth/     \u2014\u201a\n      \u2014\u201d\u2014 \u2014\u201d\u2014 \u2014\u201d\u2014\n```\n\n#### H1A \u2014 sync_all.py: 5-Environment Hub-and-Spoke\n\n**Environment registry:**\n\n```python\nENVIRONMENTS = {\n    \"windows\": {\n        \"label\": \"Windows 11 (primary dev)\",\n        \"root\": Path(\"C:/Users/clint/azazael\"),\n        \"src\":   Path(\"C:/Users/clint/azazael/src\"),\n        \"docs\":  Path(\"C:/Users/clint/azazael/docs\"),\n        \"type\": \"windows\",\n    },\n    \"wsl2\": {\n        \"label\": \"WSL2 Ubuntu-26.04\",\n        \"root\": Path(\"/root/azazael\"),\n        \"src\":   Path(\"/root/azazael/src\"),\n        \"docs\":  Path(\"/root/azazael/docs\"),\n        \"type\": \"wsl\",\n        \"wsl_distro\": \"Ubuntu-26.04\",\n    },\n    \"desktop\": {\n        \"label\": \"Desktop AZAZAEL_Standalone\",\n        \"root\": Path(\"C:/Users/clint/Desktop/AZAZAEL_Standalone\"),\n        \"type\": \"release\",\n        \"exe_only\": True,  # Only .exe files, no source tree\n    },\n    \"g_source\": {\n        \"label\": \"G: source-of-truth\",\n        \"root\": Path(\"G:/source-of-truth/azazael\"),\n        \"type\": \"archive\",\n    },\n    \"g_root\": {\n        \"label\": \"G: AZAZAEL_ROOT\",\n        \"root\": Path(\"G:/AZAZAEL/AZAZAEL_ROOT\"),\n        \"type\": \"archive\",\n    },\n}\n```\n\n**Sync pattern definitions:**\n\nCode, documentation, and script files are synchronized using glob patterns organized by category:\n\n```python\nSYNC_CODE_PATTERNS = [\n    \"src/CORE/WORMS/expansion/*.py\",\n    \"src/CORE/WORMS/CLUSTERWORMS.py\",\n    \"src/CORE/WORMS/METACLUSTER.py\",\n    \"src/CORE/WORMS/NETWORK_DIAG.py\",\n    \"src/CORE/WORMS/CODEX_TOOLS.py\",\n    \"src/CORE/WORMS/CROSS_NATURE_ROUTER.py\",\n    \"src/ORCHESTRATION/hydra_bridge.py\",\n    \"tests/*.py\",\n]\n\nSYNC_DOC_PATTERNS = [\n    \"docs/*.md\", \"docs/scripts/*.py\",\n    \"LESSONS_*.md\", \"MEMORIES*.md\", \"MASTER_TASKS.md\",\n]\n\nSYNC_SCRIPT_PATTERNS = [\"scripts/*.py\"]\n```\n\n**WSL2 sync operation (Windows \u2014 Linux):**\n\nThe most complex sync path uses WSL2's `/mnt/c/` mount to copy files from Windows to the WSL2 native filesystem:\n\n```python\ndef sync_windows_to_wsl2(dry_run=False):\n    \"\"\"Sync Windows 11 -> WSL2 via /mnt/c/ mount bridge.\"\"\"\n    windows_root = ENVIRONMENTS[\"windows\"][\"root\"]\n\n    for pattern in SYNC_CODE_PATTERNS + SYNC_DOC_PATTERNS + SYNC_SCRIPT_PATTERNS:\n        for src_file in sorted(windows_root.glob(pattern)):\n            rel_path = src_file.relative_to(windows_root)\n            src_wsl = wsl_path(src_file)            # /mnt/c/Users/clint/azazael/...\n            dest_wsl = f\"/root/azazael/{rel_path}\"  # native WSL2 path\n\n            cmd = f\"mkdir -p $(dirname {dest_wsl}) && cp {src_wsl} {dest_wsl}\"\n            rc, stdout, stderr = run_wsl(cmd)\n```\n\nThe path conversion function maps Windows paths to WSL2 mount paths:\n\n```python\ndef wsl_path(win_path: Path) -> str:\n    \"\"\"Convert Windows Path to WSL /mnt/c/... path.\"\"\"\n    s = str(win_path).replace(\"\\\\\", \"/\")\n    if s.startswith(\"C:\"): return \"/mnt/c\" + s[2:]\n    if s.startswith(\"G:\"): return \"/mnt/g\" + s[2:]\n    return s\n```\n\n**Integrity verification (cross-environment):**\n\n```python\ndef verify_integrity():\n    \"\"\"Verify file integrity across all 5 environments.\"\"\"\n    results = {}\n\n    # 1. Expansion worm files: Windows vs WSL2 (exact match)\n    win_exp = set(f.name for f in (win_root / \"src/CORE/WORMS/expansion\").glob(\"*.py\"))\n    rc, stdout, _ = run_wsl(\"ls /root/azazael/src/CORE/WORMS/expansion/*.py\")\n    wsl_exp = set(Path(f).name for f in stdout.strip().split(\"\\n\") if f)\n    results[\"expansion\"] = (win_exp == wsl_exp)\n\n    # 2. Docs: Windows vs G: source-of-truth (subset: W11 docs should exist on G:)\n    win_docs = set(f.name for f in (win_root / \"docs\").glob(\"*.md\"))\n    results[\"docs_g\"] = win_docs.issubset(g_docs)\n\n    # 3-4. Tests and scripts: Windows vs WSL2 (subset check)\n    results[\"all_ok\"] = all(results.values())\n    return results\n```\n\n**CLI interface:**\n\n```bash\npython scripts/sync_all.py --status              # Show sync status for all 5 environments\npython scripts/sync_all.py --verify              # Verify integrity across all environments\npython scripts/sync_all.py --sync-all            # Sync all environments from Windows hub\npython scripts/sync_all.py --sync-to wsl2        # Sync Windows to WSL2 only\npython scripts/sync_all.py --sync-to g           # Sync docs to G: drive archives\npython scripts/sync_all.py --sync-to desktop     # Sync docs to Desktop release\npython scripts/sync_all.py --dry-run             # Preview sync without writing\n```\n\n#### H1B \u2014 sync_canonical_docs.py: Pillar Verification (RULE 0Z-J)\n\nCanonical document sync uses SHA-256 hash-based drift detection across 4 pillars:\n\n```python\nCANONICAL_DOCS = [\n    \"SYSTEM_INSTRUCTIONS.md\",    # RULE 0K #1 \u2014 Core SOP\n    \"SOP.md\",                    # RULE 0K #2 \u2014 Error recording SOP\n    \"ERROR_LOG.md\",              # RULE 0K #3 \u2014 Error documentation\n    \"MEMORIES.md\",               # RULE 0K #4 \u2014 Session continuity\n    \"PRODUCTION_TODO.md\",        # RULE 0K #7 \u2014 Production wiring\n    \"AZAZAEL_INSIGHTS.md\",       # Architectural insights\n    \"WORM_CONFIG_TRACE.md\",      # Worm traceability\n    \"COMPLIANCE_CHECKLIST.md\",   # Compliance enforcement\n]\n\nMASTER_ROOT = Path(\"C:/Users/clint/azazael\")  # Sole authoritative source\n\nTARGET_PILLARS = {\n    \"KALI\":    Path(\"//wsl$/Kali/root/azazael\"),\n    \"UBUNTU\":  Path(\"//wsl$/Ubuntu-26.04/root/azazael\"),\n    \"G:\":      Path(\"G:/AZAZAEL_SOURCE_OF_TRUTH\"),\n}\n```\n\n**SHA-256 hash-based drift detection:**\n\n```python\ndef hash_file(filepath: Path) -> str:\n    \"\"\"Compute SHA-256 hash of a file for drift detection.\"\"\"\n    sha = hashlib.sha256()\n    with open(filepath, \"rb\") as f:\n        while chunk := f.read(8192):\n            sha.update(chunk)\n    return sha.hexdigest()\n\ndef verify_pillar(pillar_name, pillar_path, master_hashes):\n    \"\"\"Verify pillar docs match master. Handles WSL UNC paths gracefully.\"\"\"\n    mismatches = []\n    for doc in CANONICAL_DOCS:\n        master_hash = master_hashes.get(doc, \"MISSING\")\n        pillar_hash = hash_file(pillar_path / doc)\n        if pillar_hash != master_hash:\n            size_diff = (MASTER_ROOT / doc).stat().st_size - (pillar_path / doc).stat().st_size\n            mismatches.append(f\"{pillar_name}/{doc}: HASH MISMATCH \"\n                              f\"(size delta: {size_diff:+,} bytes)\")\n    return (len(mismatches) == 0), mismatches\n```\n\n**CLI interface:**\n\n```bash\npython scripts/sync_canonical_docs.py                    # Drift report (default)\npython scripts/sync_canonical_docs.py --sync             # Sync ALL pillars from master\npython scripts/sync_canonical_docs.py --sync --pillar KALI  # Sync single pillar\npython scripts/sync_canonical_docs.py --verify           # Verify all pillars match\npython scripts/sync_canonical_docs.py --verify --pillar G:  # Verify single pillar\npython scripts/sync_canonical_docs.py --hash             # Print master document hashes\npython scripts/sync_canonical_docs.py --self-test        # Internal consistency check\n```\n\n#### H1C \u2014 auto_sync.py: Poll-Based Change Detection (257L)\n\nThe auto-sync system provides continuous poll-based change detection for skill propagation across environments. It monitors watched paths and triggers sync actions when file changes are detected. See `src/SCRIPTS/auto_sync.py` for implementation.\n\n### H2 \u2014 Cross-Pillar Bridges\n\nThree bridge patterns connect Azazael to other pillars in the ecosystem, each using a different integration mechanism.\n\n#### H2A \u2014 HYDRA Pipeline Bridge (6-Stage ML Pipeline)\n\n`src/ORCHESTRATION/hydra_bridge.py` wires HYDRA's 6-stage processing cluster to InferenceBridge (LLM analysis), PAMS recording, and HORUS output formatting:\n\n```python\n@dataclass\nclass PipelineReport:\n    \"\"\"Complete pipeline execution report.\"\"\"\n    timestamp: str = \"\"\n    stages_completed: int = 0\n    stages: list[dict] = field(default_factory=list)\n    total_duration: float = 0.0\n    llm_insights: str | None = None\n    recommendations: list[str] = field(default_factory=list)\n    success: bool = False\n```\n\n**6-Stage pipeline execution with LLM feedback:**\n\n```python\nclass HydraBridge:\n    def run_full_pipeline(self, use_llm=True) -> PipelineReport:\n        \"\"\"Run the complete HYDRA pipeline with LLM feedback.\"\"\"\n        stages = [\n            ProcessingStage.DISCOVERY,\n            ProcessingStage.ANALYSIS,\n            ProcessingStage.OPTIMIZATION,\n            ProcessingStage.VALIDATION,\n            ProcessingStage.DEPLOYMENT,\n            ProcessingStage.FEEDBACK,\n        ]\n\n        for stage in stages:\n            result = self.cluster.run_stage(stage)\n            stage_info = {\n                \"stage\": stage.value,\n                \"success\": result.success,\n                \"modules_processed\": result.modules_processed,\n                \"duration\": round(time.time() - stage_start, 3),\n            }\n\n            # LLM-powered feedback analysis at FEEDBACK stage\n            if stage == ProcessingStage.FEEDBACK and use_llm and self.bridge:\n                stage_info[\"llm_analysis\"] = self._run_feedback_analysis(result)\n\n            # Record to PAMS memory\n            self._record_stage(stage.value, stage_info)\n```\n\n**LLM-powered feedback analysis:**\n\nThe FEEDBACK stage collects pipeline execution history and sends it to a local llama-server instance for analysis:\n\n```python\ndef _run_feedback_analysis(self, result: StageResult) -> str | None:\n    \"\"\"Run LLM-powered analysis of pipeline feedback.\"\"\"\n    prompt = f\"\"\"Analyze this HYDRA pipeline execution:\nNodes: {len(self.cluster.nodes)} total, {len(enabled)} enabled\nStage History:\n{chr(10).join(stage_history)}\n\nWhat went well? What can be improved?\"\"\"\n    resp = self.bridge.llama.chat([\n        {\"role\": \"system\", \"content\": \"You are a system analysis AI. Be concise.\"},\n        {\"role\": \"user\", \"content\": prompt},\n    ])\n    return resp.response if resp.success else None\n```\n\n**WSL connection via subprocess:**\n\n```python\ndef run_wsl(cmd: str, timeout: int = 60) -> tuple[int, str, str]:\n    \"\"\"Run a command inside WSL2 Ubuntu-26.04.\"\"\"\n    result = subprocess.run(\n        [\"wsl\", \"-d\", \"Ubuntu-26.04\", \"-e\", \"bash\", \"-c\", cmd],\n        capture_output=True, text=True, timeout=timeout,\n    )\n    return result.returncode, result.stdout, result.stderr\n```\n\n**PAMS memory recording:**\n\nEvery stage execution is recorded to PAMS for traceability:\n\n```python\ndef _record_stage(self, stage_name: str, data: dict, severity: str = \"info\"):\n    if self._recorder:\n        self._recorder.record_event(\n            \"hydra_stage\", data,\n            source=f\"HYDRA.{stage_name}\",\n            severity=severity,\n        )\n```\n\n#### H2B \u2014 Tigger <> Azazael (Rust pyo3 Native Extension)\n\nThe Tigger bridge uses Rust pyo3 native extensions for high-performance worm lookups, providing 1,000-32,000x speedup over pure-Python registry operations. The bridge creates a shared memory-mapped table that both Tigger (Rust) and Azazael (Python) can access without serialization overhead:\n\n```python\n# Python side: TiggerClient accessing Rust-compiled shared library\nfrom tigger import TiggerClient\ntigger = TiggerClient()\nresult = tigger.lookup_worm(\"CLUSTERWORMS\")  # 46,729x faster than Python dict\n```\n\nSee Section M (Tigger Performance Engine) for full implementation details and benchmark data.\n\n#### H2C \u2014 Vermillion <> Kali (SharedDirManager Cross-Env)\n\nThe Vermillion/Kali bridge uses `SharedDirManager` to dispatch commands from Windows to WSL2 Kali Linux for security scanning. Seven worm modules (MetasploitBridge, NmapScanner, GobusterScanner, HydraCracker, SearchsploitQuery, SMBEnum, SMBGhost) are executed inside Kali via the cross-environment bridge:\n\n```python\n# SharedDirManager dispatches across environments\nmanager = SharedDirManager(source_dir, target_env=\"kali\")\ndispatcher = manager.get_dispatcher()\n# worm execution bridged to Kali WSL\nresult = dispatcher.dispatch(\"nmap_scan\", target=\"192.168.1.0/24\")\n```\n\n#### H2D \u2014 sync_skills.py: Skills Propagation (305L)\n\nSkills (`.agents/skills/*.md`) are propagated across environments using `sync_skills.py`, ensuring that agent skills remain consistent across Windows, WSL2, and G: drive archives. The script uses the same SHA-256 hash verification pattern as `sync_canonical_docs.py`.\n\n#### H2E \u2014 AOA Quartet: 8-Arm Cross-Project Orchestration\n\nThe AOA (Architecture Orchestration Agent) Quartet is an 8-arm cross-project orchestration system connecting the four pillars (Azazael, CODEX, EveUnleashed, Libra) with 46 cross-arm routes and 264 registered paths. Each arm represents a capability domain:\n\n| Arm | Function | Connected Pillars |\n|-----|----------|-------------------|\n| azazael | Worm cluster orchestration | All |\n| codex | Video generation pipeline | CODEX Studio |\n| eve | AI model inferencing | EveUnleashed |\n| libra | Legal document generation | Libra |\n| (4 support arms) | Monitoring, bridge, archive, sync | Cross-pillar |\n\nThe Quartet routes data between arms using topological path registration, enabling cross-project workflows like: \"Analyze system metrics (azazael arm) \u2014 Generate video visualization (codex arm) \u2014 Archive to G: (support arm).\"\n\n### H3 \u2014 CROSS_ENV_MANIFEST.md (177 lines)\n\nThe CROSS_ENV_MANIFEST.md file at the project root serves as the canonical reference for the deployment topology. It documents:\n\n- **Environment 1 \u2014 Windows Desktop:** Active development host. 5 projects (AOA, Azazael, Libra, EveUnleashed, CODEX Studio). 50 GB total across 5,277 files. Full AOA orchestration (8 arms, 56 cross-arm routes). CODEX video rendering pipeline. DirectMemory event recording.\n- **Environment 2 \u2014 G: Drive:** Archive/source of truth. 9 directories spanning ~50 GB. Core source of truth documents (SYSTEM_INSTRUCTIONS.md, MEMORIES.md, ERROR_LOG.md, LESSONS_MASTER.md). 39 standalone .exe files. 200+ historical HTML renders.\n- **Environment 3 \u2014 WSL Ubuntu:** No native project files. Accesses Windows files via `/mnt/c/`. Used for Linux-native Python execution and cross-platform builds.\n- **Environment 4 \u2014 Kali Linux (WSL):** Security testing environment. Accesses Windows files via `/mnt/c/`. Used for security audits with Vermillion bridge.\n\nThe manifest includes a corrections log from a July 2, 2026 architecture disclosure audit that identified and corrected 4 key misrepresentations (worm count, cross-arm routes, Quartet structure, arm capabilities).\n\n### H4 \u2014 paths.py Dynamic Resolution (216 lines)\n\n`src/CORE/paths.py` (or equivalent) provides 8 dynamic path resolvers ensuring cross-platform compatibility:\n\n**Key resolvers:**\n\n```python\ndef get_project_root() -> Path:\n    \"\"\"Find project root by traversing up from current file or env var.\"\"\"\n\ndef get_g_drive() -> Path | None:\n    \"\"\"Locate G: drive (external/network). Returns None if unavailable.\"\"\"\n\ndef get_wsl_path(windows_path: Path) -> str:\n    \"\"\"Convert Windows path to WSL /mnt/... format.\"\"\"\n\ndef get_desktop_path() -> Path:\n    \"\"\"Return C:/Users/clint/Desktop/ path.\"\"\"\n\ndef get_standalone_path() -> Path:\n    \"\"\"Return AZAZAEL_Standalone path on Desktop or G:.\"\"\"\n```\n\nThe resolvers handle 3 platform scenarios:\n1. **Windows 11 (native):** Direct `C:/` and `G:/` paths\n2. **WSL2 (Linux):** `/mnt/c/` and `/mnt/g/` mount paths\n3. **Cross-platform fallback:** Environment variable overrides (`AZAZAEL_ROOT`, `G_DRIVE`)\n\nThe `AZAZAEL_ROOT` environment variable is the primary override mechanism, allowing all environments to resolve paths consistently regardless of filesystem layout.\n## SECTION I: Whitepaper Production Pipeline\n\n> **Verified July 6, 2026** \u2014 All source data assets confirmed present on disk. Pipeline produces HTML whitepaper, MP4 disclosure video, and JSONL audit package.\n\n### I1 \u2014 Source Data for Whitepaper\n\n| # | Data Source | Format | Content | Status |\n|---|-------------|--------|---------|--------|\n| 1 | **DISCLOSURE_WHITEPAPER_TODO.md** (this file) | Markdown | Full capability catalog \u2014 14 sections, 2000+ lines | \u2705 LIVE |\n| 2 | **Worm Registry** (`worm_registry.py`) | Python dict | 99 discovered, 104 registry keys, 18 categories, priority spread P1-P10 | \u2705 VERIFIED |\n| 3 | **DirectMemory DB** (`~/.azazael/memory_store.db`) | SQLite WAL | 79,210 sessions, 646,928 events, 1,117.86 MB | \u2705 LIVE |\n| 4 | **Audit trail** (`.audit/`) | JSONL Ed25519-signed | 63 JSONL files (15 root + 48 azazael/) | \u2705 VERIFIED |\n| 5 | **AOA benchmark_data.json** | JSON | Live me _session()` |\n\n### L2 \u2014 15-Layer Verification Pipeline\n\n```\nLayer  1: Path Existence          \u2014 audit file exists at expected path\nLayer  2: File Integrity          \u2014 SHA-256 matches recorded hash\nLayer  3: Append-Only             \u2014 no mid-file modifications (line count check)\nLayer  4: Hash Chain              \u2014 each entry.prev_hash == previous.hash\nLayer  5: Genesis Anchor          \u2014 genesis entry has hash=64 zeroes\nLayer  6: Ed25519 Signature       \u2014 signature verifies against pubkey\nLayer  7: Public Key Integrity    \u2014 pubkey matches ~/.azazael/audit_signing_key.pub\nLayer  8: Merkle Root             \u2014 double-SHA256 tree, root in session_end\nLayer  9: Root-of-Trust           \u2014 anchors.jsonl head hash matches latest entry\nLayer 10: Checkpoint Verification \u2014 every-100-entry checkpoint hashes match\nLayer 11: Truncation Detection    \u2014 entry_count vs actual line count\nLayer 12: Rate Anomaly            \u2014 >100 entries/sec triggers warning\nLayer 13: Temporal Anomaly        \u2014 future timestamps trigger failure\nLayer 14: Quantity Anomaly        \u2014 >100K lines_changed triggers investigation\nLayer 15: Cross-Ledger            \u2014 DualLedgerValidator: .audit/ vs memory_store.db\n```\n\n### L3 \u2014 Cryptographic Components\n\n| Component | Algorithm | Key Size | Location | Status |\n|-----------|-----------|----------|----------|--------|\n| **Hash chain** | SHA-256 | 256 bits | `.audit/session_*.jsonl` (every entry) | \u2705 ACTIVE |\n| **Signing** | Ed25519 | 256-bit private key | `~/.azazael/audit_signing_key` | \u2705 ACTIVE |\n| **Public key** | Ed25519 | 256-bit public | `~/.azazael/audit_signing_key.pub` | \u2705 ACTIVE |\n| **Merkle tree** | Double SHA-256 | 256-bit root | Per-session, stored in `session_end` entry | \u2705 ACTIVE |\n| **Anchoring** | SHA-256 | 256-bit | `.audit/anchors.jsonl` | \u2705 ACTIVE |\n| **Event UUID** | UUID7 (RFC 9562) | 122 bits | Every `memories` row, time-sortable | \u2705 ACTIVE |\n| **BLAKE2b hash** | BLAKE2b-256 | 256 bits | `audit_hash` column in memory_store.db | \u2705 ACTIVE |\n\n### L4 \u2014 Dual-Ledger Cross-Validation (CD2)\n\nThe Dual-Ledger system cross-validates `.audit/` JSONL (hash-chained append-only) against `~/.azazael/memory_store.db` (SQLite searchable):\n\n```\n.audit/ JSONL (immutable truth)          memory_store.db (queryable evidence)\n\u2014            \u2014\n\u2014\u201a session_start            \u2014\u201a            \u2014\u201a session_id, started_at     \u2014\u201a\n\u2014\u201a file_read (hash chain)   \u2014\u201a\u2014CD2\u2014 \u2014\u201a event_type='file_read'      \u2014\u201a\n\u2014\u201a file_edit (Ed25519 sig)  \u2014\u201a  cross-   \u2014\u201a data:{filepath,description} \u2014\u201a\n\u2014\u201a test_run (Merkle root)   \u2014\u201a  validate \u2014\u201a event_uuid, trace_id        \u2014\u201a\n\u2014\u201a session_end (root hash)  \u2014\u201a            \u2014\u201a audit_hash (BLAKE2b)       \u2014\u201a\n\u2014\u201d\u2014            \u2014\u201d\u2014\n```\n\n### L5 \u2014 Verification Tools\n\n| Tool | Function | Location |\n|------|----------|----------|\n| `audit_trail.py` | Hash chain verification, Merkle proof generation, anomaly detection | `src/CORE/audit_trail.py` |\n| `dual_ledger.py` | Cross-ledger DM\u2014AJ correlation and consistency check | `src/CORE/dual_ledger.py` |\n| `RealtimeAuditPipeline` | 15-layer in-process audit middleware | `src/CORE/compliance/governance.py` |\n| `DualLedgerValidator` | CD2 batch cross-validation with discrepancy reporting | `src/CORE/compliance/governance.py` |\n| `VerifiableLieProtocol` | Multi-layer audit verification, hardened mode, middleware pipeline | `src/CORE/compliance/governance.py` |\n\n### L6 \u2014 Audit Trail File Format\n\n```jsonl\n{\"event_type\":\"session_start\",\"description\":\"Codebuff session - autodiff suite\",\"timestamp\":\"2026-06-14T12:49:31Z\",\"session_id\":\"codebuff_20260614_
