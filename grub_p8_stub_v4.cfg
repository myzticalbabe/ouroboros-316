# BM recovery stub v4 - 2026-11-13
# P8 ext4 UUID 58e46179-d777-4203-a807-8794a3fb2351, read from the live
# superblock at P8+1024 (s_uuid).  v4 rule: no path may fail silently.
# Every failure prints a named ERROR/WARN line, and the last entry always
# reaches Windows, so a broken P8 can never leave a menu that boots nothing.
set p8uuid=58e46179-d777-4203-a807-8794a3fb2351
set timeout=20
set default=0

echo "BM stub v4 - P8 $p8uuid"

insmod part_gpt
insmod ext2
insmod linux
insmod chain
insmod fat
if ! insmod search_fs_uuid; then echo "WARN: module search_fs_uuid unavailable"; fi
if ! insmod search_fs_file; then echo "WARN: module search_fs_file unavailable"; fi

function p8_find {
  set root=''
  if search --no-floppy --fs-uuid --set=root $p8uuid; then
    return 0
  fi
  if search --no-floppy --file /boot/grub/grub.cfg --set=root; then
    echo "WARN: P8 located by file search, not by UUID"
    return 0
  fi
  echo "ERROR: P8 filesystem $p8uuid not found on any device"
  return 1
}

function p8_boot_kernel {
  if [ ! -f $1 ]; then
    echo "ERROR: missing kernel $1"
    return 1
  fi
  if [ ! -f $2 ]; then
    echo "ERROR: missing initrd $2 for kernel $1"
    return 1
  fi
  linux $1 root=UUID=$p8uuid ro quiet splash
  initrd $2
}

if p8_find; then
  if [ -f /boot/grub/grub.cfg ]; then
    set prefix=($root)/boot/grub
    configfile ($root)/boot/grub/grub.cfg
    echo "ERROR: P8 grub.cfg loaded then returned - falling back to menu"
  else
    echo "WARN: P8 has no /boot/grub/grub.cfg - use the direct entries"
  fi
else
  echo "ERROR: P8 unreachable - only Windows can boot from here"
fi

menuentry 'Ubuntu (P8 auto - newest kernel)' {
  if p8_find; then
    set k=''
    for f in /boot/vmlinuz-*; do set k=$f; done
    set i=''
    for f in /boot/initrd.img-*; do set i=$f; done
    if [ -z "$k" ]; then
      echo "ERROR: no /boot/vmlinuz-* present on P8"
    else
      if [ -z "$i" ]; then
        echo "ERROR: no /boot/initrd.img-* present on P8"
      else
        echo "booting $k with $i"
        p8_boot_kernel $k $i
      fi
    fi
  fi
}

menuentry 'Ubuntu (P8 direct - 7.0.0-15)' {
  if p8_find; then
    p8_boot_kernel /boot/vmlinuz-7.0.0-15-generic /boot/initrd.img-7.0.0-15-generic
  fi
}

menuentry 'Ubuntu (P8 direct - 7.0.0-14)' {
  if p8_find; then
    p8_boot_kernel /boot/vmlinuz-7.0.0-14-generic /boot/initrd.img-7.0.0-14-generic
  fi
}

menuentry 'Ubuntu (P8 recovery console)' {
  if p8_find; then
    if [ ! -f /boot/grub/grub.cfg ]; then
      echo "ERROR: no /boot/grub/grub.cfg - dropping to plain GRUB shell"
    fi
    set prefix=($root)/boot/grub
    normal
  fi
}

menuentry 'GRUB diagnostics (read this if a boot fails)' {
  echo "p8uuid      = $p8uuid"
  echo "root        = $root"
  echo "prefix      = $prefix"
  echo "--- devices ---"
  ls
  if p8_find; then
    echo "P8 resolved to: $root"
    echo "--- /boot on P8 ---"
    ls ($root)/boot
    echo "--- /boot/grub on P8 ---"
    ls ($root)/boot/grub
  else
    echo "P8 NOT resolvable - filesystem unreadable by this GRUB"
  fi
  echo "--- ESP /EFI/ubuntu ---"
  ls (hd0,gpt1)/EFI/ubuntu
  echo "--- end diagnostics, returning to menu in 30s ---"
  sleep 30
}

menuentry 'Windows 11 (chainload)' {
  insmod part_gpt
  insmod fat
  insmod chain
  if search --no-floppy --file /EFI/Microsoft/Boot/bootmgfw.efi --set=root; then
    chainloader /EFI/Microsoft/Boot/bootmgfw.efi
  else
    echo "ERROR: bootmgfw.efi not found on any ESP - Windows would need firmware menu"
  fi
}
