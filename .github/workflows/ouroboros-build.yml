name: Ouroboros Build

on: [push, release]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . pytest
      - name: Tests
        run: python -m pytest tests -q
  build-owh:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Assemble .owh
        run: |
          python -m ouroboros make-owh examples/cross.owh.json -o dist/cross.owh
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ouroboros-owh
          path: dist/*.owh