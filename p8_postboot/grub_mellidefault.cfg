# GRUB stub - MELLI-first for the unattended first boot - 2026-11-13
#
# Byte-identical entries to grub_winfirst.cfg; the ONLY functional change is
# `set default=1` (MELLI) instead of `set default=0` (Windows), so a reboot
# with no one at the keyboard boots MELLI-OS after the 10 s menu.
# Windows stays one arrow-key away: a MELLI panic costs a hard reset, not
# the machine. After a confirmed MELLI boot, redeploy grub_winfirst.cfg
# (default=0) to restore Windows-first.
#
# Evidence this stub supersedes: QEMU pre-flight GREEN (serial log
# /srv/mb/qemu-serial.log) + ESP kernel 5d75b9a6 hash-verified on S:.
set timeout=10
set timeout_style=menu
set default=1

insmod part_gpt
insmod fat
insmod chain
insmod search
insmod search_fs_file
insmod normal

menuentry 'Windows 11 (chainload, default)' {
  insmod part_gpt
  insmod fat
  insmod chain
  if search --no-floppy --file --set=root /EFI/Microsoft/Boot/bootmgfw.efi ; then
    chainloader /EFI/Microsoft/Boot/bootmgfw.efi
  else
    echo "ERROR: bootmgfw.efi not found on any ESP - check Disk0 P1"
    sleep 20
  fi
}

menuentry 'MELLI-OS 1.0 (chainload vmlinuz.efi)' {
  insmod part_gpt
  insmod fat
  insmod chain
  if search --no-floppy --file --set=root /EFI/MELLI/vmlinuz.efi ; then
    chainloader /EFI/MELLI/vmlinuz.efi
  else
    echo "ERROR: /EFI/MELLI/vmlinuz.efi not found on any ESP - P1 was reformatted or MELLI was removed"
    sleep 20
  fi
}

menuentry 'Ubuntu (no root right now - MELLI pending)' {
  echo "ERROR: old P8 root UUID 58e46179-... was deleted with P8 on 2026-11-13"
  echo "P4 is the empty 205G MELLI placeholder - no kernel to boot yet."
  echo "Boot Windows above. This entry boots nothing by design."
  sleep 30
}

menuentry 'Diagnostics (what GRUB can actually see)' {
  echo "--- prefix / root ---"
  echo "$prefix"
  echo "$root"
  echo "--- devices ---"
  ls
  echo "--- ESP root ---"
  ls ($root)/
  echo "--- end of diagnostics, returning to menu in 60s ---"
  sleep 60
}
