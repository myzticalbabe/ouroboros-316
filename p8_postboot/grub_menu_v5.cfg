# P8 boot menu v5 - 2026-11-13
#
# WHY v5 EXISTS. Every earlier version of this file (840, 1596 and 3494 bytes)
# ran `configfile ($root)/boot/grub/grub.cfg` BEFORE defining its own entries.
# GRUB's `configfile` REPLACES the running configuration, so none of the
# menuentries written below that line were ever displayed: the menu the user
# saw was the contents of /boot/grub/grub.cfg, which holds memtest x2,
# Windows Boot Manager and UEFI Firmware Settings and no Ubuntu at all.
# That is why twelve edits to this file changed nothing on screen.
#
# v5 rule: the menu is defined HERE. The distro's grub.cfg is reachable only
# as an explicit menu choice, never automatically. No entry may depend on a
# second file being correct, and every failure prints a named ERROR line.
#
# Root filesystem: P8, ext4, UUID read from the live superblock at P8+1024.
set p8uuid=58e46179-d777-4203-a807-8794a3fb2351
set timeout=30
set timeout_style=menu
set default=0

insmod part_gpt
insmod ext2
insmod linux
insmod chain
insmod fat
insmod normal
insmod search
insmod search_fs_uuid
insmod search_fs_file
insmod regexp

# Point root at the P8 root filesystem by UUID.
function p8_by_uuid {
  set root=
  if search --no-floppy --fs-uuid --set=root $p8uuid ; then
    return 0
  fi
  echo "ERROR: no filesystem on any device carries UUID $p8uuid"
  return 1
}

# Point root at the filesystem that actually holds a given kernel. This covers
# both layouts: kernels under /boot on the root filesystem, and kernels at the
# top of a separate /boot filesystem.
function p8_by_kernel {
  set root=
  if search --no-floppy --file --set=root /boot/vmlinuz-$1 ; then
    return 0
  fi
  if search --no-floppy --file --set=root /vmlinuz-$1 ; then
    return 0
  fi
  echo "ERROR: no filesystem holds vmlinuz-$1 (checked /boot/vmlinuz-$1 and /vmlinuz-$1)"
  return 1
}

# Boot one specific kernel version, refusing to boot a kernel with no initrd.
function p8_boot_version {
  if p8_by_kernel $1 ; then
    set k=
    set i=
    if [ -f /boot/vmlinuz-$1 ] ; then
      set k=/boot/vmlinuz-$1
      set i=/boot/initrd.img-$1
    else
      set k=/vmlinuz-$1
      set i=/initrd.img-$1
    fi
    if [ ! -f $i ] ; then
      echo "ERROR: $k exists but $i does not - refusing to boot a kernel with no initrd"
      sleep 20
      return 1
    fi
    echo "booting $k"
    linux $k root=UUID=$p8uuid ro quiet splash
    initrd $i
  fi
}

menuentry 'Ubuntu 26.04 - 7.0.0-15 (P8, default)' {
  p8_boot_version 7.0.0-15
}

menuentry 'Ubuntu 26.04 - 7.0.0-14 (P8)' {
  p8_boot_version 7.0.0-14
}

menuentry 'Ubuntu (auto: newest kernel on the P8 root)' {
  if p8_by_uuid ; then
    set f=
    set ver=
    set k=
    set i=
    for f in /boot/vmlinuz-* ; do
      if [ -f $f ] ; then
        if regexp --set 1:ver '^/boot/vmlinuz-(.*)$' $f ; then
          set k=/boot/vmlinuz-$ver
          set i=/boot/initrd.img-$ver
        fi
      fi
    done
    if [ -z "$k" ] ; then
      echo "ERROR: no /boot/vmlinuz-* on the P8 root - open the diagnostics entry"
      sleep 20
    else
      if [ ! -f $i ] ; then
        echo "ERROR: $k has no matching $i"
        sleep 20
      else
        echo "booting $k"
        linux $k root=UUID=$p8uuid ro quiet splash
        initrd $i
      fi
    fi
  fi
}

menuentry 'Other: the distro grub.cfg (memtest, firmware, Windows)' {
  if p8_by_uuid ; then
    if [ -f /boot/grub/grub.cfg ] ; then
      set prefix=($root)/boot/grub
      configfile ($root)/boot/grub/grub.cfg
    else
      echo "ERROR: /boot/grub/grub.cfg is not on the P8 root"
      sleep 20
    fi
  fi
}

menuentry 'Diagnostics (what GRUB can actually see)' {
  echo "p8uuid = $p8uuid"
  echo "--- devices ---"
  ls
  if p8_by_uuid ; then
    echo "--- root resolved to ---"
    echo "$root"
    echo "--- /boot on P8 ---"
    ls ($root)/boot
    echo "--- /boot/grub on P8 ---"
    ls ($root)/boot/grub
  else
    echo "P8 UUID not found on any device"
  fi
  echo "--- end of diagnostics, returning to menu in 60s ---"
  sleep 60
}

menuentry 'Windows 11 (chainload)' {
  insmod part_gpt
  insmod fat
  insmod chain
  if search --no-floppy --file --set=root /EFI/Microsoft/Boot/bootmgfw.efi ; then
    chainloader /EFI/Microsoft/Boot/bootmgfw.efi
  else
    echo "ERROR: bootmgfw.efi not found on any ESP"
    sleep 20
  fi
}
